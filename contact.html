<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Nivetha Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f4f9;
    margin: 0;
    padding: 0;
    color: #333;
  }
  header {
    background: linear-gradient(135deg, #111, #444);
    color: #fff;
    padding: 20px;
    text-align: center;
    
  }
  header h1 {
    margin: 0;
  }
  nav {
    margin-top: 10px;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
  }
  nav a:hover {
    text-decoration: underline;
  }

  h2 {
    text-align: center;
    font-size: 2.5em;
    color: #333;
    margin-top: 40px;
  }
  h2 span {
    color: #a020f0;
  }

  .contact-wrapper {
    display: flex;
    gap: 40px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
  }

  .profile-pic img {
    width: 250px;
    border-radius: 15px;
    box-shadow: 0 0 15px #a020f0;
  }

  .contact-container {
    flex: 1;
    min-width: 300px;
    background: #111;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #a020f0;
    color: #fff;
  }
  label {
    display: block;
    margin: 10px 0 5px;
    font-weight: bold;
    color: #a020f0;
  }
  input, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: #fff;
  }
  input::placeholder, textarea::placeholder {
    color: #aaa;
  }
  button {
    background: #a020f0;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
    font-weight: bold;
  }
  button:hover {
    background: #7a0fc0;
  }

  /* Social links */
  .social-links {
    text-align: center;
    margin-top: 30px;
  }
  .social-links a {
    display: inline-block;
    margin: 0 10px;
    color: #fff;
    background: #a020f0;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    transition: background 0.3s;
  }
  .social-links a:hover {
    background: #7a0fc0;
  }
  p{
    width: 300px;
  }
  h5{text-align: center;
    color: #a020f0;
  }
  /* 📱 Mobile (up to 768px) */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    gap: 30px;
  }

  .box {
    height: 250px;
    max-width: 90%;
  }

  .content h1 {
    font-size: 22px;
    text-align: center;
  }

  .content p {
    font-size: 14px;
    line-height: 22px;
  }
}

/* 📲 Tablet (769px – 1024px) */
@media (min-width: 769px) and (max-width: 1024px) {
  .container {
    flex-direction: row;
    gap: 40px;
  }

  .box {
    height: 300px;
    max-width: 45%;
  }

  .content {
    max-width: 50%;
  }

  .content h1 {
    font-size: 26px;
  }

  .content p {
    font-size: 15px;
    line-height: 24px;
  }
}

/* 💻 Laptop (1025px – 1440px) */
@media (min-width: 1025px) and (max-width: 1440px) {
  .container {
    gap: 60px;
  }

  .box {
    height: 350px;
    max-width: 40%;
  }

  .content {
    max-width: 50%;
  }

  .content h1 {
    font-size: 28px;
  }

  .content p {
    font-size: 16px;
    line-height: 26px;
  }
}

/* 🖥️ Large PC screens (1441px and above) */
@media (min-width: 1441px) {
  .container {
    gap: 80px;
  }

  .box {
    height: 400px;
    max-width: 35%;
  }

  .content {
    max-width: 50%;
  }

  .content h1 {
    font-size: 32px;
  }

  .content p {
    font-size: 18px;
    line-height: 28px;
  }
}

</style>
<body>

<header>
  <h1>CONTACT</h1>
  <h5>Get in touch</h5>
  <nav>
    <a href="index.html">About</a>
    <a href="skill.html">Skills</a>
    <a href="services.html">Services</a>
    <a href="samples.html">Samples</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="contact">
  <h2>CONTACT <span>ME</span></h2>
  <div class="contact-wrapper">
    
    <!-- Left: Profile Image -->
    <div class="profile-pic">
      <h3>LETS WORK TOGETHER</h3>
      <b><p>Have a project in mind? Let's create amazing projects together 😊</p></b>
      <img src="WhatsApp Image 2026-07-21 at 10.31.31 AM.jpeg" alt="Nivetha">
      
    </div>
    
    <!-- Right: Contact Form -->
    <div class="contact-container">
      <form action="https://script.google.com/macros/s/AKfycbyShcP36OxodEj3wAUOpbhlyWcR2INJeB5JiocLsTgVTjG9ftPWW21c_-6j3M32Fu5u/exec" method="post">
        <label for="name">Name *</label>

      <!-- Social Media Links -->
      <div class="social-links">
        <a href="https://www.instagram.com/nivique.visuals?igsh=MTA4a2FkazY3ZW82MQ==" target="_blank">Instagram</a>
        <a href="https://wa.me/9952433420" target="_blank">WhatsApp</a>
        <a href="mailto:niviquevisuals@gmail.com">Mail</a>
       
      </div>
    </div>
  </div>
</section>

</body>
</html>
